# Builds the single-file demo (scripts/single_html.py) and publishes it to GitHub Pages as
# index.html, so the pitch slides can carry a QR code to a page that opens on any phone or laptop.
# The build reads only committed files (replay cache, cases, web/); no API key, no policy PDFs.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "readmark/**"
      - "runs/**"
      - "data/**"
      - "scripts/single_html.py"
      - "scripts/single_html_shim.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync runtime dependencies
        run: uv sync --frozen --no-dev
      - name: Build dist/readmark.html
        env:
          PYTHONUTF8: "1"
        run: uv run python scripts/single_html.py
      - name: Stage the site
        run: mkdir _site && cp dist/readmark.html _site/index.html
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
