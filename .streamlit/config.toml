[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true

# [theme] values are design/design-system/tokens.json verbatim; fonts are vendored below.
[theme]
primaryColor = "#b4462a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#161616"
borderColor = "#e0e0e0"
# Surface 1 / backgroundColor token
baseFontSize = 15
# Smaller page title / textColor token
# h1..h6; the option takes a list or one string, never a table (streamlit/config.py, 1.63)
headingFontSizes = ["1.75rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]
metricValueFontSize = "2rem"
# Surface 1 / secondaryBackgroundColor token
dataframeHeaderBackgroundColor = "#f4f4f4"
# Border / borderColor token
dataframeBorderColor = "#e0e0e0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0px"
buttonRadius = "0px"
font = "IBM Plex Sans, sans-serif"
# primaryColor token; the accent doubles as the link colour
linkColor = "#b4462a"
headingFont = "IBM Plex Sans, sans-serif"
codeFont = "Source Code Pro"
chartCategoricalColors = ["#8a6400", "#007d79", "#9f1853", "#198038", "#2d5bbf", "#4d5358"]
chartSequentialColors = ["#fbf1ec", "#f5dcd1", "#edc2b0", "#e3a68e", "#d6886b", "#c66a4c", "#b4462a", "#963920", "#762c18", "#561f10"]
chartDivergingColors = ["#004144", "#005d5d", "#007d79", "#4fa8a3", "#a6d5d2", "#f0c6b5", "#de9a80", "#c86b4c", "#b4462a", "#6e2a17"]
redColor = "#da1e28"
redBackgroundColor = "#fff1f1"
redTextColor = "#a2191f"
orangeColor = "#ff832b"
orangeBackgroundColor = "#fff2e8"
orangeTextColor = "#8a3800"
yellowColor = "#f1c21b"
yellowBackgroundColor = "#fcf4d6"
yellowTextColor = "#684e00"
greenColor = "#24a148"
greenBackgroundColor = "#defbe6"
greenTextColor = "#0e6027"
blueColor = "#0072c3"
blueBackgroundColor = "#e5f6ff"
blueTextColor = "#003a6d"
violetColor = "#8a3ffc"
violetBackgroundColor = "#f6f2ff"
violetTextColor = "#491d8b"
grayColor = "#8d8d8d"
grayBackgroundColor = "#f4f4f4"
grayTextColor = "#525252"

# Dark chrome: all 5 keys verified in streamlit.config._config_options_template (1.63.0).
# showSidebarBorder is app-level only and stays in [theme] above.
[theme.sidebar]
# textColor token, used as the sidebar ground
backgroundColor = "#161616"
# secondaryBackgroundColor token, used as the sidebar ink
textColor = "#f4f4f4"
# chart-palette locality.Town token (Carbon gray-90)
secondaryBackgroundColor = "#262626"
# grayTextColor token; the research note's Carbon gray-80 is in no token file, this is nearest
borderColor = "#525252"
# primaryColor token: the active-page indicator
primaryColor = "#b4462a"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Light.woff2"
weight = "300"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = "400"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = "600"
