[project]
name = "fair-turn"
version = "0.1.0"
description = "Fair Turn: housing maintenance triage decision support (CDU IT Code Fair 2026, AI Challenge)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit",
    "pandas",
    "altair",
    "scikit-learn",
    "statsmodels",
    "textstat",
    "pydantic",
    "openpyxl",
    "pypdf>=6.18.1",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
