# The easy example's questions (Task-21). A lecturer at CDU decides a student's request for an
# assessment extension. Each question rests on one verbatim sentence from CDU's Higher Education
# Coursework Assessment Policy and Procedure (current version, effective 1 March 2026), which
# scripts/fetch_cdu_policy.py rebuilds locally. The policy text itself is not in the repo: CDU's
# terms allow private and in-organisation use, not publishing.
#
# Fields as in the housing list: clause_id; policy; source; title; decides; sentence (verbatim);
# items (optional verbatim list entries that complete the sentence).

- clause_id: ext-before-due
  policy: assessment
  source: Procedure (64)
  title: Asked before the due date
  decides: Was the request made before the due date and time? A later request has to go as special consideration.
  sentence: A student can request an extension to the lecturer via the CDU online form in Learnline up until the due date and time of submission.

- clause_id: ext-grounds
  policy: assessment
  source: Procedure (66)
  title: A listed reason
  decides: Is the student's reason one of the reasons the procedure lists, and not a discretionary activity?
  sentence: "A request for extension can be made on the following grounds:"
  items:
    - acute illness or medical reasons;
    - disability, as per a formally approved Access Plan;
    - personal or family circumstances;
    - unforeseen employment related circumstances;
    - religious and cultural obligations;
    - volunteer, emergency, or military service;
    - elite athlete; or
    - other unforeseen or extenuating circumstance.

- clause_id: ext-form
  policy: assessment
  source: Procedure (68)
  title: Request form complete
  decides: Does the request give everything the form asks for?
  sentence: "Students must complete the formal CDU extension request form online in Learnline and include the following information in their request:"
  items:
    - student name and student number;
    - unit name, unit code, the assessment task name and task number;
    - current due time and date, and the proposed adjusted due date;
    - reason for requesting an extension, accompanied by relevant evidence to support the request (i.e., a medical certificate, or statutory declaration); and
    - a copy of the current draft of their assessment task (where applicable).

- clause_id: ext-evidence
  policy: assessment
  source: Procedure (65)
  title: Evidence for more than 72 hours
  decides: If the extension is longer than 72 hours, or the free 72-hour extension was already used, does evidence support the whole period asked for?
  sentence: Students must provide evidence for extension requests beyond 72 hours, or once the 72-hour unevidenced extension for a unit has been accessed.

- clause_id: ext-length
  policy: assessment
  source: Procedure (71)
  title: Seven days at most
  decides: Is the new due date within seven calendar days of the old one? Longer needs special consideration.
  sentence: Extensions without penalty may be approved for up to seven (7) calendar days for an assessment.
